version: "3.9"

services:

  redis:
    image: redis
    container_name: redis-ms
    ports:
      - "6379:6379"
    networks:
      - eazybank
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  configserver:
    image: "sohan91/configserver:s10"
    container_name: configserver-ms
    ports:
      - "8071:8071"
    networks:
      - eazybank
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "configserver"

  eurekaserver:
    image: "sohan91/eurekaserver:s10"
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"
    networks:
      - eazybank
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"

  accounts:
    image: "sohan91/accounts:s10"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    networks:
      - eazybank
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "accounts"

  loans:
    image: "sohan91/loans:s10"
    container_name: loans-ms
    ports:
      - "8090:8090"
    networks:
      - eazybank
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "loans"

  cards:
    image: "sohan91/cards:s10"
    container_name: cards-ms
    ports:
      - "9000:9000"
    networks:
      - eazybank
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "cards"

  gatewayserver:
    image: "sohan91/gatewayserver:s10"
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"
    networks:
      - eazybank
    depends_on:
      accounts:
        condition: service_healthy
      loans:
        condition: service_healthy
      cards:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gatewayserver"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_CONNECT-TIMEOUT: 2s
      SPRING_DATA_REDIS_TIMEOUT: 1s

networks:
  eazybank:
    driver: bridge