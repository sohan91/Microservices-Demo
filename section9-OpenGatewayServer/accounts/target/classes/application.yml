server:
  port: 8080

spring:
  application:
    name: accounts

  profiles:
    active: default

  config:
    import: optional:configserver:http://localhost:8071/
    # Force local config to take precedence
    use-legacy-processing: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ''

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: "health,info,shutdown"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    info:
      enabled: true
    shutdown:
      enabled: true
  info:
    env:
      enabled: true

# Application information - ADD THIS SECTION
info:
  app:
    name: ${spring.application.name}
    description: Bank Accounts Application
    version: 1.0.0
    java:
      version: ${java.version}
    environment: ${spring.profiles.active:default}
    server:
      port: ${server.port}
  build:
    artifact: accounts
    group: com.eazybytes
    version: 1.0.0
    time: ${maven.build.timestamp:unknown}
  spring:
    version: ${spring.version}

# Eureka Configuration
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: http://localhost:${spring.application.name}:${server.port}
    non-secure-port: ${server.port}
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    appname: ${spring.application.name}

  client:
    register-with-eureka: true
    fetch-registry: true
    heartbeat-executor-thread-pool-size: 2
    cache-refresh-executor-thread-pool-size: 2
    service-url:
      defaultZone: http://localhost:8070/eureka/
    healthcheck:
      enabled: false

logging:
  level:
    com.netflix.discovery: INFO
    org.springframework.cloud.netflix.eureka: INFO